[project]
name = "opsteam-core"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-ulid>=4.0.1",
    "rfc8785>=0.1.4",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
