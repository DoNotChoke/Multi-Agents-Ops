name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: runner/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make setup
      - name: codegen-check
        run: make codegen && git diff --exit-code
      - run: make lint
      - run: make test
      - run: make eval

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: opsteam
          POSTGRES_PASSWORD: dev-only-postgres
          POSTGRES_DB: opsteam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsteam -d opsteam"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      OPSTEAM_APP_DB_PASSWORD: dev-only-app-db
      OPSTEAM_MIGRATOR_DB_PASSWORD: dev-only-migrator-db
      OPSTEAM_SYSTEM_DB_PASSWORD: dev-only-system-db
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: create roles
        env:
          PGPASSWORD: dev-only-postgres
        run: >-
          psql -h 127.0.0.1 -U opsteam -d opsteam
          -v app_password="$OPSTEAM_APP_DB_PASSWORD"
          -v migrator_password="$OPSTEAM_MIGRATOR_DB_PASSWORD"
          -v system_password="$OPSTEAM_SYSTEM_DB_PASSWORD"
          -f packages/db/opsteam_db/sql/roles.sql
      # Not a service container: those start before checkout, so they cannot mount policies/.
      - name: start opa
        run: >-
          docker run -d --name opa -p 127.0.0.1:8181:8181
          -v "$PWD/policies:/policies:ro" openpolicyagent/opa:1.21.3-debug
          run --server --addr=0.0.0.0:8181 /policies
      - run: uv sync
      - run: make test-integration

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runner/go.mod
          cache: false
      - run: uvx pre-commit run gitleaks --all-files
