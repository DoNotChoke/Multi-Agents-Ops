name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: runner/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make setup
      - name: codegen-check
        run: make codegen && git diff --exit-code
      - run: make lint
      - run: make test
      - run: make eval

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runner/go.mod
          cache: false
      - run: uvx pre-commit run gitleaks --all-files
