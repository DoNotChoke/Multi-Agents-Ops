# Local dev stack. Every port binds 127.0.0.1; values come from .env (copied from .env.example).
# Langfuse and its ClickHouse only start with `--profile llm-obs` (make dev-up LLM_OBS=1).
name: opsteam-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: opsteam
      TZ: UTC
      OPSTEAM_APP_DB_PASSWORD: ${OPSTEAM_APP_DB_PASSWORD}
      OPSTEAM_MIGRATOR_DB_PASSWORD: ${OPSTEAM_MIGRATOR_DB_PASSWORD}
      OPSTEAM_SYSTEM_DB_PASSWORD: ${OPSTEAM_SYSTEM_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ../../packages/db/opsteam_db/sql:/opsteam-sql:ro
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d opsteam"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    # noeviction: Langfuse queues live in Redis and must not be evicted.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs-data:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  rustfs-init:
    image: amazon/aws-cli:2.38.4
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for b in evidence langfuse; do
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket $$b 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3 mb s3://$$b || exit 1;
        done

  temporal:
    image: temporalio/temporal:1.9.1
    # The volume sits on the non-root user's home so it inherits that ownership.
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --ui-ip=0.0.0.0
      - --db-filename=/home/temporal/temporal.db
    volumes:
      - temporal-data:/home/temporal
    ports:
      - 127.0.0.1:7233:7233
      - 127.0.0.1:8233:8233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

  opa:
    # -debug variant ships busybox (no wget); OPA loads /policies before it starts listening.
    image: openpolicyagent/opa:1.21.3-debug
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policies"]
    volumes:
      - ../../policies:/policies:ro
    ports:
      - 127.0.0.1:8181:8181
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':8181 '"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm import file.
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      # The image has no curl/wget; probe the management port with bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40

  clickhouse:
    image: clickhouse/clickhouse-server:25.12.11.4
    profiles: [llm-obs]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-worker:
    image: langfuse/langfuse-worker:4.68.0
    profiles: [llm-obs]
    depends_on: &langfuse-deps
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rustfs-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    environment: &langfuse-env
      # Langfuse binds to $HOSTNAME; 0.0.0.0 lets the in-container healthcheck reach it.
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: http://localhost:3100
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://rustfs:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3030/api/health"]
      interval: 5s
      timeout: 5s
      retries: 40

  langfuse-web:
    image: langfuse/langfuse:4.68.0
    profiles: [llm-obs]
    depends_on: *langfuse-deps
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
    ports:
      - 127.0.0.1:3100:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/public/health"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  temporal-data:
  clickhouse-data:
