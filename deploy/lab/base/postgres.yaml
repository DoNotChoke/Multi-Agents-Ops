apiVersion: v1
kind: Secret
metadata:
  name: postgres
type: Opaque
stringData:
  # Fake lab-only credentials.
  POSTGRES_USER: shop
  POSTGRES_PASSWORD: dev-only-lab-postgres
  DATABASE_URL: postgres://shop:dev-only-lab-postgres@postgres:5432/shop?sslmode=disable
---
# The data dir is an emptyDir, so the schema is recreated on every Postgres start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-orders.sql: |
    CREATE TABLE IF NOT EXISTS orders (
      id bigserial PRIMARY KEY,
      amount int NOT NULL,
      created_at timestamptz NOT NULL DEFAULT now()
    );
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { service: postgres }
  template:
    metadata:
      labels: { service: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          env:
            - { name: POSTGRES_DB, value: shop }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD } }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "shop", "-d", "shop"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap: { name: postgres-init }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { service: postgres }
  ports:
    - port: 5432
