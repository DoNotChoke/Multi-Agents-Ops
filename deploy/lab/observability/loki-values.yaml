# grafana/loki chart, pinned in lab.sh: one single-binary replica on local disk, no caches.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 24h

singleBinary:
  replicas: 1
  # Loki needs a writable /var/loki; kind's local-path provisioner backs this PVC.
  persistence:
    enabled: true
    size: 2Gi

gateway:
  verboseLogging: false
  service:
    type: NodePort
    nodePort: 30100

read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
