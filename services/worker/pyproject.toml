[project]
name = "opsteam-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "opsteam-agents",
    "opsteam-core",
    "opsteam-contracts",
    "opsteam-db",
    "opsteam-evidence",
    "opsteam-llm",
    "opsteam-policy",
    "opsteam-tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
