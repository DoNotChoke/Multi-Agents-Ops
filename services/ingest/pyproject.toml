[project]
name = "opsteam-ingest"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "opsteam-core",
    "opsteam-db",
    "opsteam-incidents",
    "opsteam-obs",
    "prometheus-client>=0.22",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
